<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support — Luminor Theme</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 80px 24px;
  }
  .logo {
    font-size: 21px;
    font-weight: 600;
    color: #1d1d1f;
    margin-bottom: 12px;
    letter-spacing: -0.01em;
  }
  h1 {
    font-size: 56px;
    font-weight: 700;
    letter-spacing: -0.03em;
    margin-bottom: 24px;
    line-height: 1.05;
  }
  p.subtitle {
    font-size: 19px;
    color: #6e6e73;
    margin-bottom: 48px;
  }
  .card {
    background: #fff;
    border-radius: 18px;
    padding: 40px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.04);
  }
  h2 {
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 16px;
    letter-spacing: -0.01em;
  }
  .contact-item {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 20px;
    padding-bottom: 20px;
    border-bottom: 1px solid #e5e5ea;
  }
  .contact-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .icon {
    width: 40px;
    height: 40px;
    background: #f5f5f7;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .label {
    font-size: 14px;
    color: #6e6e73;
    margin-bottom: 2px;
  }
  .value {
    font-size: 17px;
    font-weight: 500;
  }
  a { color: #0071e3; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .response-time {
    font-size: 14px;
    color: #6e6e73;
    margin-top: 16px;
  }
  footer {
    margin-top: 60px;
    text-align: center;
    font-size: 12px;
    color: #86868b;
  }
  @media (max-width: 640px) {
    h1 { font-size: 40px; }
    .card { padding: 28px 24px; }
    .container { padding: 48px 20px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="logo">Luminor</div>
  <h1>Support</h1>
  <p class="subtitle">We're here to help you get the most out of the Luminor theme.</p>

  <div class="card">
    <h2>Get in touch</h2>

    <div class="contact-item">
      <div class="icon">✉️</div>
      <div>
        <div class="label">Email</div>
        <div class="value"><a href="mailto:z1345036885@gmail.com">z1345036885@gmail.com</a></div>
      </div>
    </div>

    <div class="contact-item">
      <div class="icon">📚</div>
      <div>
        <div class="label">Documentation</div>
        <div class="value"><a href="https://kiritocheng.github.io/luminor-help/docs/">Read the docs →</a></div>
      </div>
    </div>

    <p class="response-time">We typically respond within 24–48 hours.</p>
  </div>

  <footer>© 2026 Luminor Studio. All rights reserved.</footer>
</div>
</body>
</html>
